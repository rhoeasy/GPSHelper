name: Android Release & Auto Tag

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:
    inputs:
      bump:
        description: "版本号递增方式（auto 会按提交信息自动判断）"
        required: false
        default: "auto"
        type: choice
        options:
          - auto
          - patch
          - minor
          - major
      custom_version:
        description: "可选：手动指定版本号（如 1.2.0 或 v1.2.0，留空则按上方规则自动递增）"
        required: false
        default: ""
        type: string

permissions:
  contents: write

concurrency:
  group: android-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code (full history for tagging)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Compute next semantic version tag
        id: version
        shell: bash
        run: |
          set -euo pipefail

          CUSTOM_VER=$(echo "${{ github.event.inputs.custom_version || '' }}" | tr -d '[:space:]')
          if [ -n "$CUSTOM_VER" ]; then
            CLEAN_VER="${CUSTOM_VER#v}"
            if ! [[ "$CLEAN_VER" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
              echo "::error::自定义版本号格式无效：$CUSTOM_VER（请使用类似 1.2.0 或 v1.2.0 的格式）"
              exit 1
            fi
            NEXT_TAG="v${CLEAN_VER}"
            if git rev-parse -q --verify "refs/tags/${NEXT_TAG}" >/dev/null; then
              CREATED="false"
            else
              CREATED="true"
            fi
          else
            EXISTING_HEAD_TAG=$(git tag --points-at HEAD --list "v*.*.*" --sort=-v:refname | head -n 1 || true)
            if [ -n "$EXISTING_HEAD_TAG" ]; then
              echo "当前提交已存在 Tag: $EXISTING_HEAD_TAG"
              NEXT_TAG="$EXISTING_HEAD_TAG"
              CREATED="false"
            else
              LATEST_TAG=$(git tag --list "v*.*.*" --sort=-v:refname | head -n 1 || true)
              if [ -z "$LATEST_TAG" ]; then
                NEXT_TAG="v1.0.0"
              else
                CLEAN_VER="${LATEST_TAG#v}"
                IFS='.' read -r MAJOR MINOR PATCH <<< "$CLEAN_VER"
                MAJOR=${MAJOR:-1}
                MINOR=${MINOR:-0}
                PATCH=${PATCH:-0}

                BUMP_MODE="${{ github.event.inputs.bump || 'auto' }}"
                COMMIT_MSG=$(git log -1 --pretty=%B)

                if [ "$BUMP_MODE" = "auto" ]; then
                  if echo "$COMMIT_MSG" | grep -qiE '\[major\]|BREAKING CHANGE'; then
                    BUMP_MODE="major"
                  elif echo "$COMMIT_MSG" | grep -qiE '\[minor\]|^feat(\([^)]+\))?:'; then
                    BUMP_MODE="minor"
                  else
                    BUMP_MODE="patch"
                  fi
                fi

                case "$BUMP_MODE" in
                  major)
                    MAJOR=$((MAJOR + 1))
                    MINOR=0
                    PATCH=0
                    ;;
                  minor)
                    MINOR=$((MINOR + 1))
                    PATCH=0
                    ;;
                  *)
                    PATCH=$((PATCH + 1))
                    ;;
                esac

                NEXT_TAG="v${MAJOR}.${MINOR}.${PATCH}"
              fi
              CREATED="true"
            fi
          fi

          VERSION_NAME="${NEXT_TAG#v}"
          IFS='.' read -r V_MAJOR V_MINOR V_PATCH <<< "$VERSION_NAME"
          V_MAJOR=${V_MAJOR:-1}
          V_MINOR=${V_MINOR:-0}
          V_PATCH=${V_PATCH:-0}
          VERSION_CODE=$((10#$V_MAJOR * 10000 + 10#$V_MINOR * 100 + 10#$V_PATCH))

          echo "构建版本: tag=$NEXT_TAG, versionName=$VERSION_NAME, versionCode=$VERSION_CODE (created=$CREATED)"
          echo "tag=$NEXT_TAG" >> "$GITHUB_OUTPUT"
          echo "version_name=$VERSION_NAME" >> "$GITHUB_OUTPUT"
          echo "version_code=$VERSION_CODE" >> "$GITHUB_OUTPUT"
          echo "created=$CREATED" >> "$GITHUB_OUTPUT"

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Locate Android project root
        id: project
        shell: bash
        run: |
          PROJECT_DIR=$(find . -maxdepth 3 -name "settings.gradle*" -printf "%h\n" | head -n 1)
          if [ -z "$PROJECT_DIR" ]; then
            echo "::error::未找到 Android 工程目录（缺少 settings.gradle.kts）"
            exit 1
          fi
          echo "找到工程目录: $PROJECT_DIR"
          echo "dir=$PROJECT_DIR" >> "$GITHUB_OUTPUT"

      - name: Run JVM & Robolectric unit tests
        working-directory: ${{ steps.project.outputs.dir }}
        run: |
          if [ ! -f "debug.keystore" ]; then
            if [ -f "debug.keystore.base64" ]; then
              base64 -d debug.keystore.base64 > debug.keystore
            else
              keytool -genkey -v -keystore debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
            fi
          fi

          if [ -f "./gradlew" ]; then
            chmod +x ./gradlew
            ./gradlew :app:testDebugUnitTest
          else
            gradle :app:testDebugUnitTest
          fi

      - name: Verify Release signing secrets & build signed Release APK + AAB
        working-directory: ${{ steps.project.outputs.dir }}
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -euo pipefail

          if [ -z "$KEYSTORE_BASE64" ] || [ -z "$STORE_PASSWORD" ] || [ -z "$KEY_PASSWORD" ]; then
            echo "::error::缺少正式版签名配置！请在 GitHub 仓库 Settings -> Secrets and variables -> Actions 中配置 KEYSTORE_BASE64、STORE_PASSWORD 和 KEY_PASSWORD（alias 必须为 upload）。详细步骤见 README.md。"
            exit 1
          fi

          echo "$KEYSTORE_BASE64" | tr -d '\n\r ' | base64 -d > my-upload-key.jks

          # 若用户自备证书的 alias 不是 upload（例如 release），在临时副本中自动映射为 upload 以匹配 build.gradle.kts
          if ! keytool -list -keystore my-upload-key.jks -storepass "$STORE_PASSWORD" -alias upload >/dev/null 2>&1; then
            DETECTED_ALIAS=$(keytool -list -keystore my-upload-key.jks -storepass "$STORE_PASSWORD" | awk -F',' '/PrivateKeyEntry/{print $1; exit}')
            if [ -n "$DETECTED_ALIAS" ]; then
              echo "检测到证书别名为 '$DETECTED_ALIAS'，正在临时映射为 'upload' 以匹配 Gradle 配置..."
              keytool -changealias -keystore my-upload-key.jks -storepass "$STORE_PASSWORD" -alias "$DETECTED_ALIAS" -destalias upload -keypass "$KEY_PASSWORD"
            fi
          fi

          export KEYSTORE_PATH="$(pwd)/my-upload-key.jks"
          export APP_VERSION_NAME="${{ steps.version.outputs.version_name }}"
          export APP_VERSION_CODE="${{ steps.version.outputs.version_code }}"

          echo "Injecting Android app version into Gradle: versionName=${APP_VERSION_NAME}, versionCode=${APP_VERSION_CODE}"

          if [ -f "./gradlew" ]; then
            chmod +x ./gradlew
            ./gradlew assembleRelease bundleRelease \
              -PappVersionName="$APP_VERSION_NAME" \
              -PappVersionCode="$APP_VERSION_CODE"
          else
            gradle assembleRelease bundleRelease \
              -PappVersionName="$APP_VERSION_NAME" \
              -PappVersionCode="$APP_VERSION_CODE"
          fi

          TAG="${{ steps.version.outputs.tag }}"
          mkdir -p dist

          APK_SRC=$(find app/build/outputs/apk/release -name "*.apk" | head -n 1)
          AAB_SRC=$(find app/build/outputs/bundle/release -name "*.aab" | head -n 1)

          if [ -z "$APK_SRC" ] || [ -z "$AAB_SRC" ]; then
            echo "::error::未找到生成的正式包（APK 或 AAB）"
            exit 1
          fi

          cp "$APK_SRC" "dist/GPS-HUD-${TAG}-release.apk"
          cp "$AAB_SRC" "dist/GPS-HUD-${TAG}-release.aab"
          ls -lh dist/

      - name: Cleanup temporary keystore
        if: always()
        working-directory: ${{ steps.project.outputs.dir }}
        run: rm -f my-upload-key.jks

      - name: Push Git Tag
        if: steps.version.outputs.created == 'true'
        run: |
          TAG="${{ steps.version.outputs.tag }}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "$TAG" -m "Release $TAG"
          git push origin "$TAG"

      - name: Upload Release Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: GPS-HUD-${{ steps.version.outputs.tag }}-release
          path: "${{ steps.project.outputs.dir }}/dist/*"

      - name: Publish GitHub Release
        working-directory: ${{ steps.project.outputs.dir }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ steps.version.outputs.tag }}"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/* --clobber
          else
            gh release create "$TAG" dist/* \
              --title "GPS 悬浮仪表 ${TAG}" \
              --generate-notes
          fi
