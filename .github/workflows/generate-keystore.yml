name: Generate Release Keystore (Cloud)

on:
  workflow_dispatch:
    inputs:
      common_name:
        description: "证书名称 (CN)"
        required: true
        default: "GPSHelper"
        type: string
      organization:
        description: "组织/作者名称 (O)"
        required: true
        default: "Rhoeasy"
        type: string
      country:
        description: "国家代码 (C，两位大写字母)"
        required: true
        default: "CN"
        type: string

permissions:
  contents: read

jobs:
  generate:
    runs-on: ubuntu-latest

    steps:
      - name: Set up JDK 21 (provides keytool in cloud)
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Generate signed release keystore (alias=upload)
        env:
          EXISTING_STORE_PASS: ${{ secrets.STORE_PASSWORD }}
          EXISTING_KEY_PASS: ${{ secrets.KEY_PASSWORD }}
          INPUT_CN: ${{ github.event.inputs.common_name }}
          INPUT_O: ${{ github.event.inputs.organization }}
          INPUT_C: ${{ github.event.inputs.country }}
        run: |
          set -euo pipefail

          # Sanitize DN fields to prevent commas/quotes breaking -dname
          SAFE_CN=$(printf '%s' "$INPUT_CN" | tr -cd '[:alnum:] ._-')
          SAFE_O=$(printf '%s' "$INPUT_O" | tr -cd '[:alnum:] ._-')
          SAFE_C=$(printf '%s' "$INPUT_C" | tr -cd '[:alpha:]' | tr '[:lower:]' '[:upper:]' | cut -c1-2)
          SAFE_CN=${SAFE_CN:-GPSHelper}
          SAFE_O=${SAFE_O:-Rhoeasy}
          SAFE_C=${SAFE_C:-CN}

          if [ -n "$EXISTING_STORE_PASS" ]; then
            STORE_PASS="$EXISTING_STORE_PASS"
            PASS_SOURCE="使用你已在 GitHub Secrets 中配置的 STORE_PASSWORD"
          else
            STORE_PASS=$(openssl rand -base64 18 | tr -dc 'A-Za-z0-9' | head -c 20)
            PASS_SOURCE="云端自动生成的 20 位高强度随机密码（请写入 GitHub Secrets）"
          fi

          if [ -n "$EXISTING_KEY_PASS" ]; then
            KEY_PASS="$EXISTING_KEY_PASS"
          else
            KEY_PASS="$STORE_PASS"
          fi

          echo "::add-mask::$STORE_PASS"
          echo "::add-mask::$KEY_PASS"

          mkdir -p keystore-output

          keytool -genkeypair -v \
            -keystore keystore-output/my-upload-key.jks \
            -storetype JKS \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -alias upload \
            -storepass "$STORE_PASS" \
            -keypass "$KEY_PASS" \
            -dname "CN=${SAFE_CN}, O=${SAFE_O}, C=${SAFE_C}"

          B64=$(base64 -w 0 keystore-output/my-upload-key.jks)
          echo "::add-mask::$B64"
          printf '%s' "$B64" > keystore-output/KEYSTORE_BASE64.txt

          cat <<EOF > keystore-output/SETUP_INFO.txt
          ================================================
          GPS 悬浮仪表 - 正式签名证书云端生成结果
          ================================================
          证书主体: CN=${SAFE_CN}, O=${SAFE_O}, C=${SAFE_C}
          证书别名 (alias): upload  （已与 app/build.gradle.kts 严格对齐）
          密码来源: ${PASS_SOURCE}

          请打开 GitHub 仓库 -> Settings -> Secrets and variables -> Actions，
          配置以下 3 个 Repository Secrets：

          1. KEYSTORE_BASE64
             -> 复制同目录下 KEYSTORE_BASE64.txt 的全部内容（单行无换行）

          2. STORE_PASSWORD
             -> ${STORE_PASS}

          3. KEY_PASSWORD
             -> ${KEY_PASS}

          【重要安全提示】
          1. 下载并保存好 my-upload-key.jks 与上述密码后，请立即回到 GitHub Actions
             删除本次「Generate Release Keystore (Cloud)」运行记录（防止他人下载产物）。
          2. 切勿将 my-upload-key.jks 提交到代码仓库。
          3. 配置好 3 个 Secret 后，下次推送代码或手动运行「Android Release & Auto Tag」
             即可自动打 Tag 并编译正式签名 APK + AAB！
          EOF

      - name: Upload temporary keystore bundle (1-day retention)
        uses: actions/upload-artifact@v4
        with:
          name: release-keystore-bundle
          path: keystore-output/*
          retention-days: 1
